<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to IScraper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">IScraper</div>
      <h1>Save this page</h1>
      <p id="tab-title" class="muted">Reading current tab...</p>

      <label for="note">Note optional</label>
      <textarea id="note" maxlength="500" placeholder="Why save this?"></textarea>

      <button id="save" type="button">Save to library</button>
      <button id="lens" type="button">Lens search this page</button>
      <button id="open" type="button" class="secondary">Open IScraper</button>

      <details>
        <summary>App URL</summary>
        <input id="app-url" type="url" value="https://iscraper.vercel.app" />
        <button id="save-url" type="button" class="secondary">Save URL</button>
      </details>

      <details open>
        <summary>Lens token</summary>
        <input id="lens-token" type="password" placeholder="Paste Lens token from IScraper" />
        <button id="save-token" type="button" class="secondary">Save token</button>
        <button id="connect" type="button" class="secondary">Create token in IScraper</button>
      </details>

      <p id="status" class="muted"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
